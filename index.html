<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WICS-ESP32 installer</title>
    <meta
      name="description"
      content="Easily allow users to install WICS-ESP32 firmware on the web."
    />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI",
          Roboto, Ubuntu, sans-serif;
        padding: 0;
        margin: 0;
        line-height: 1.4;
      }
      .content {
        max-width: 600px;
        margin: 0 auto;
        padding: 12px;
      }
      h2 {
        margin-top: 2em;
      }
      h3 {
        margin-top: 1.5em;
      }
      a {
        color: #03a9f4;
      }
      .content pre {
        max-width: 100%;
        overflow-y: scroll;
      }
      .footer {
        margin-top: 24px;
        border-top: 1px solid #ccc;
        padding-top: 24px;
        text-align: center;
      }
      .footer .initiative {
        font-style: italic;
        margin-top: 16px;
      }
      table {
        border-spacing: 0;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid #ccc;
      }
      .radios li {
        list-style: none;
        line-height: 2em;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #333;
          color: #fff;
        }
        a {
          color: #58a6ff;
        }
      }
    </style>
    <!-- Vi uppdaterar till det officiella skriptet som ESPHome själva använder på sin testsida -->
    <script type="module" src="https://unpkg.com"></script>
  </head>
  <body>
    <div class="content">
      <h1>WICS-ESP32 installer</h1>
      <p>This is a Prototype and NOT in Production, Please come back later.</p>
      <p>Select your Board</p>
      <ul class="radios">
        <li>
          <!-- Vi sätter checked på Gateway som standard -->
          <label><input type="radio" name="type" value="gateway" checked /> Gateway Board - DCC-IN</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="gateway1" /> Gateway Board - DCC-IN + DCC-EX</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="pca" /> PCA9685 Board</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="mp3" /> MP3 Board</label>
        </li>
        <li>  
          <label><input type="radio" name="type" value="multi2" /> Multi II Board</label>
        </li>
        <li>  
          <label><input type="radio" name="type" value="us" /> Universal Sensor Board</label>
        </li>  
        <li>
          <label><input type="radio" name="type" value="cs" /> Current Sensor Board</label>
        </li>
       </ul>
      <p class="button-row" align="center">
        <!-- Knappen startar med gateway-manifestet färdigladdat och är fullt synlig direkt -->
        <esp-web-install-button manifest="./manifest_gateway.json"></esp-web-install-button>
      </p>

      <div class="footer">
        <a href="https://github.io"
          >WICS - Wireless Control System</a
        > &mdash;
        Installer powered by <a href="https://github.io">ESP Web Tools</a>.
      </div>
    </div>

    <script>
      document.querySelectorAll('input[name="type"]').forEach(radio =>
        radio.addEventListener("change", () => {
          const buttonContainer = document.querySelector('.button-row');
          
          // Rensar bort den gamla knappen helt
          buttonContainer.innerHTML = '';
          
          // Skapar en helt ny knapp som tvingar webbläsaren att läsa in det nya manifestet korrekt
          const newButton = document.createElement('esp-web-install-button');
          newButton.setAttribute('manifest', `./manifest_${radio.value}.json`);
          
          buttonContainer.appendChild(newButton);
        })
      );
    </script>
  </body>
</html>
