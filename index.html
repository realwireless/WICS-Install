<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WICS-ESP32 installer</title>
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 0; margin: 0; line-height: 1.4;
      }
      .content { max-width: 600px; margin: 0 auto; padding: 12px; }
      a { color: #03a9f4; }
      .footer { margin-top: 24px; border-top: 1px solid #ccc; padding-top: 24px; text-align: center; }
      .radios li { list-style: none; line-height: 2em; }
      @media (prefers-color-scheme: dark) {
        body { background-color: #333; color: #fff; }
        a { color: #58a6ff; }
      }
    </style>
    <!-- Den stabila versionen av ESP Web Tools -->
    <script type="module" src="https://unpkg.com"></script>
  </head>
  <body>
    <div class="content">
      <h1>WICS-ESP32 installer</h1>
      <p>This is a Test version in Production, Please come back later.</p>
      
      <p>Select your Board</p>
      <ul class="radios">
        <li>
          <label><input type="radio" name="type" value="gateway" checked /> Gateway Board - DCC-IN (ESP32-C6)</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="gateway1" /> Gateway Board - DCC-IN + DCC-EX (ESP32-C6)</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="pca" /> PCA9685 Board (XIAO ESP32-S3)</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="mp3" /> MP3 Board (XIAO ESP32-S3)</label>
        </li>
        <li>  
          <label><input type="radio" name="type" value="multi2" /> Multi II Board (ESP32-S3)</label>
        </li>
       </ul>

      <p class="button-row" align="center">
        <!-- Vi startar med knappen färdigkonfigurerad utan externa JSON-anrop -->
        <esp-web-install-button id="installBtn"></esp-web-install-button>
      </p>

      <div class="footer">
        <a href="https://github.io">WICS - Wireless Control System</a> &mdash;
        Installer powered by <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a>.
      </div>
    </div>

    <script>
      // Alla dina kort konfigureras direkt här i JavaScriptet för att slippa CORS-problem!
      const manifests = {
        gateway: {
          name: "WICS Gateway - DCC-IN",
          version: "1.0.1",
          chipFamily: "ESP32-C6",
          installable: { images: [{ path: "firmware_gateway.bin", offset: 0 }] }
        },
        gateway1: {
          name: "WICS Gateway - DCC-IN + DCC-EX",
          version: "1.0.1",
          chipFamily: "ESP32-C6",
          installable: { images: [{ path: "firmware_gateway1.bin", offset: 0 }] }
        },
        pca: {
          name: "WICS PCA9685 Servo Board",
          version: "1.0.1",
          chipFamily: "ESP32-S3",
          installable: { images: [{ path: "firmware_pca.bin", offset: 0 }] }
        },
        mp3: {
          name: "WICS MP3 Sound Board",
          version: "1.0.1",
          chipFamily: "ESP32-S3",
          installable: { images: [{ path: "firmware_mp3.bin", offset: 0 }] }
        },
        multi2: {
          name: "WICS Multi II Board",
          version: "1.0.1",
          chipFamily: "ESP32-S3",
          installable: { images: [{ path: "firmware_multi2.bin", offset: 0 }] }
        }
      };

      const button = document.getElementById('installBtn');

      // Sätt standardinställningen direkt vid sidladdning
      button.manifest = manifests.gateway;

      // Lyssna på när användaren byter kort i listan
      document.querySelectorAll('input[name="type"]').forEach(radio =>
        radio.addEventListener("change", () => {
          // Vi tilldelar det inbäddade objektet direkt till knappen
          button.manifest = manifests[radio.value];
        })
      );
    </script>
  </body>
</html>
