<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WICS-ESP32 installer</title>
    <meta
      name="description"
      content="Easily allow users to install WICS-ESP32 firmware on the web."
    />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI",
          Roboto, Ubuntu, sans-serif;
        padding: 0;
        margin: 0;
        line-height: 1.4;
      }
      .content {
        max-width: 600px;
        margin: 0 auto;
        padding: 12px;
      }
      h2 {
        margin-top: 2em;
      }
      h3 {
        margin-top: 1.5em;
      }
      a {
        color: #03a9f4;
      }
      .invisible {
        visibility: hidden;
      }
      .hidden {
        display: none;
      }
      esp-web-install-button[install-unsupported] {
        visibility: inherit;
      }
      .content pre {
        max-width: 100%;
        overflow-y: scroll;
      }
      .footer {
        margin-top: 24px;
        border-top: 1px solid #ccc;
        padding-top: 24px;
        text-align: center;
      }
      .footer .initiative {
        font-style: italic;
        margin-top: 16px;
      }
      table {
        border-spacing: 0;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid #ccc;
      }
      .radios li {
        list-style: none;
        line-height: 2em;
      }
      /* Stil för dropdowns */
      .menu-select {
        width: 100%;
        padding: 10px;
        margin: 8px 0 20px 0;
        font-size: 16px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background-color: #fff;
        color: #000;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #333;
          color: #fff;
        }
        a {
          color: #58a6ff;
        }
        .menu-select {
          background-color: #444;
          color: #fff;
          border: 1px solid #555;
        }
      }
    </style>
    <!-- Den ursprungliga skriptlänken som fungerar bäst -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10.1.1/dist/web/install-button.js?module"></script>
  </head>
  <body>
    <div class="content">
      <h1>WICS-ESP32 installer</h1>
      <p>Only the Gateways and the PCA9685 Board is available for installation today.</p>
      
      <!-- Steg 1: Huvudval av kort -->
      <label for="main-category"><strong>Select Board:</strong></label>
      <select id="main-category" class="menu-select">
        <option value="">-- Choose Board --</option>
        <option value="gateway_multi">Gateway Board</option> <!-- Öppnar Gateway-undermeny -->
        <option value="mp3_multi">MP3 Board</option>         <!-- Öppnar MP3-undermeny -->
        <option value="./manifest_pca.json">PCA9685 Board</option>
        <option value="./manifest_multi2.json">Multi II Board</option>
      </select>

      <!-- Steg 2A: Undermeny för Gateway -->
      <div id="gateway-container" class="hidden sub-container">
        <label for="gateway-select"><strong>Select Gateway MCU Variant:</strong></label>
        <select id="gateway-select" class="menu-select">
          <option value="">-- Choose Chip & Feature --</option>
          <option value="./manifest_gateway_dcc_in_c6.json">DCC-IN (ESP32-C6)</option>
          <option value="./manifest_gateway_dcc_in_s3.json">DCC-IN (ESP32-S3)</option>
          <option value="./manifest_gateway_dcc_ex_c6.json">DCC-IN + DCC-EX (ESP32-C6)</option>
          <option value="./manifest_gateway_dcc_ex_s3.json">DCC-IN + DCC-EX (ESP32-S3)</option>
        </select>
      </div>

      <!-- Steg 2B: Undermeny för MP3 -->
      <div id="mp3-container" class="hidden sub-container">
        <label for="mp3-select"><strong>Select MP3 Board Variant:</strong></label>
        <select id="mp3-select" class="menu-select">
          <option value="">-- Choose Wattage --</option>
          <option value="./manifest_mp3_3w.json">MP3-3W</option>
          <option value="./manifest_mp3_5w.json">MP3-5W</option>
          <option value="./manifest_mp3_10w.json">MP3-10/20W</option>
        </select>
      </div>

      <p class="button-row" align="center">
        <esp-web-install-button class="invisible"></esp-web-install-button>
      </p>

      <div class="footer">
        <a href="./README.md">WICS - Wireless Control System</a> &mdash;
        Installer powered by <a href="https://github.io">ESP Web Tools</a>.
      </div>
    </div>

    <script>
      const mainSelect = document.getElementById('main-category');
      const gatewaySelect = document.getElementById('gateway-select');
      const gatewayContainer = document.getElementById('gateway-container');
      const mp3Select = document.getElementById('mp3-select');
      const mp3Container = document.getElementById('mp3-container');
      const button = document.querySelector('esp-web-install-button');

      // Funktion för att dölja alla undermenyer och nollställa deras val
      function resetSubMenus() {
        document.querySelectorAll('.sub-container').forEach(container => {
          container.classList.add('hidden');
        });
        gatewaySelect.value = "";
        mp3Select.value = "";
        button.classList.add('invisible');
        button.removeAttribute('manifest');
      }

      // Hantera val i huvudmenyn
      mainSelect.addEventListener('change', () => {
        const val = mainSelect.value;
        resetSubMenus();

      if (val === "gateway_multi") {
        gatewayContainer.classList.remove('hidden');
      } else if (val === "mp3_multi") {
        mp3Container.classList.remove('hidden');
      } else if (val) {
        button.setAttribute('manifest', val); 
        button.classList.remove('invisible');
      }   
      });

      // Lyssna på Gateway-undermenyn
      gatewaySelect.addEventListener('change', () => {
        handleSubMenuSelection(gatewaySelect.value);
      });

      // Lyssna på MP3-undermenyn
      mp3Select.addEventListener('change', () => {
        handleSubMenuSelection(mp3Select.value);
      });

      // Gemensam funktion för att sätta manifest-filen från undermenyer
      function handleSubMenuSelection(manifestPath) {
        if (manifestPath) {
          button.setAttribute('manifest', manifestPath); 
          button.classList.remove('invisible');
        } else {
          button.classList.add('invisible');
          button.removeAttribute('manifest');
        }
      }  
    </script>
  </body>
</html>
