<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WICS-ESP32 installer</title>
    <meta name="description" content="Easily allow users to install WICS-ESP32 firmware on the web." />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 0; margin: 0; line-height: 1.4;
      }
      .content { max-width: 600px; margin: 0 auto; padding: 12px; }
      a { color: #03a9f4; }
      .radios li { list-style: none; line-height: 2em; }
      @media (prefers-color-scheme: dark) {
        body { background-color: #333; color: #fff; }
        a { color: #58a6ff; }
      }
    </style>
    <!-- Korrigerad skriptlänk med en exakt versionssiffra (10.1.5) för stabil inläsning -->
    <script type="module" src="https://unpkg.com"></script>
  </head>
  <body>
    <div class="content">
      <h1>WICS-ESP32 installer</h1>
      <p>This is TEST3 and NOT in Production, Please come back later.</p>
      
      <p>Select your Board</p>
      <ul class="radios">
        <li>
          <label><input type="radio" name="type" value="gateway" /> Gateway Board - DCC-IN</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="gateway1" /> Gateway Board - DCC-IN + DCC-EX</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="pca" /> PCA9685 Board</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="mp3" /> MP3 Board</label>
        </li>
        <li>  
          <label><input type="radio" name="type" value="multi2" /> Multi II Board</label>
        </li>
       </ul>

      <!-- Här i denna container kommer knappen att skapas i samma sekund som ett val görs -->
      <div id="buttonContainer" style="text-align: center; margin: 20px 0; min-height: 50px;"></div>

      <div class="footer">
        <a href="https://github.io">WICS - Wireless Control System</a> &mdash;
        Installer powered by <a href="https://github.io">ESP Web Tools</a>.
      </div>
    </div>

    <script>
      document.querySelectorAll('input[name="type"]').forEach(radio =>
        radio.addEventListener("change", () => {
          const container = document.getElementById('buttonContainer');
          
          // Töm containern helt
          container.innerHTML = '';
          
          // Skapa en ny knapp med rätt manifestfil kopplad till sig
          const newButton = document.createElement('esp-web-install-button');
          newButton.manifest = `./manifest_${radio.value}.json`;
          
          // Skjut in knappen på skärmen
          container.appendChild(newButton);
        })
      );
    </script>
  </body>
</html>
