<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WICS-ESP32 installer</title>
    <meta name="description" content="Easily allow users to install WICS-ESP32 firmware on the web." />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        padding: 0; margin: 0; line-height: 1.4;
      }
      .content { max-width: 600px; margin: 0 auto; padding: 12px; }
      a { color: #03a9f4; }
      .invisible { display: none; }
      .radios li { list-style: none; line-height: 2em; }
      @media (prefers-color-scheme: dark) {
        body { background-color: #333; color: #fff; }
        a { color: #58a6ff; }
      }
    </style>
    <!-- Vi använder den stabila versionen som ESPHome själva kör på sin testsida -->
    <script type="module" src="https://unpkg.com"></script>
  </head>
  <body>
    <div class="content">
      <h1>WICS-ESP32 installer</h1>
      <p>This is TEST2 and NOT in Production, Please come back later.</p>
      
      <p>Select your Board</p>
      <ul class="radios">
        <li>
          <label><input type="radio" name="type" value="gateway" /> Gateway Board - DCC-IN</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="gateway1" /> Gateway Board - DCC-IN + DCC-EX</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="pca" /> PCA9685 Board</label>
        </li>
        <li>
          <label><input type="radio" name="type" value="mp3" /> MP3 Board</label>
        </li>
        <li>  
          <label><input type="radio" name="type" value="multi2" /> Multi II Board</label>
        </li>
       </ul>

      <!-- Denna behållare är tom från början så att ingen gammal konfiguration ligger sparad -->
      <p class="button-row" align="center"></p>

      <div class="footer">
        <a href="https://github.io">WICS - Wireless Control System</a> &mdash;
        Installer powered by <a href="https://esphome.github.io/esp-web-tools/">ESP Web Tools</a>.
      </div>
    </div>

    <script>
      document.querySelectorAll('input[name="type"]').forEach(radio =>
        radio.addEventListener("change", () => {
          const buttonContainer = document.querySelector('.button-row');
          
          // 1. Töm behållaren helt (raderar den gamla knappen ur webbläsarens minne)
          buttonContainer.innerHTML = '';
          
          // 2. Skapa en helt ny, fräsch installationsknapp i realtid
          const newButton = document.createElement('esp-web-install-button');
          
          // 3. Sätt sökvägen till manifest-filen (t.ex. ./manifest_gateway.json)
          newButton.setAttribute('manifest', `./manifest_${radio.value}.json`);
          
          // 4. Skjut in den nya knappen på skärmen
          buttonContainer.appendChild(newButton);
        })
      );
    </script>
  </body>
</html>
