<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>WICS-ESP32 installer</title>
    <meta
      name="description"
      content="Easily allow users to install WICS-ESP32 firmware on the web."
    />
    <meta name="viewport" content="width=device-width" />
    <meta name="color-scheme" content="dark light" />
    <style>
      body {
        font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI",
          Roboto, Ubuntu, sans-serif;
        padding: 0;
        margin: 0;
        line-height: 1.4;
      }
      .content {
        max-width: 600px;
        margin: 0 auto;
        padding: 12px;
      }
      h2 {
        margin-top: 2em;
      }
      h3 {
        margin-top: 1.5em;
      }
      a {
        color: #03a9f4;
      }
      .invisible {
        visibility: hidden;
      }
      .hidden {
        display: none;
      }
      esp-web-install-button[install-unsupported] {
        visibility: inherit;
      }
      .content pre {
        max-width: 100%;
        overflow-y: scroll;
      }
      .footer {
        margin-top: 24px;
        border-top: 1px solid #ccc;
        padding-top: 24px;
        text-align: center;
      }
      .footer .initiative {
        font-style: italic;
        margin-top: 16px;
      }
      table {
        border-spacing: 0;
      }
      td {
        padding: 8px;
        border-bottom: 1px solid #ccc;
      }
      .radios li {
        list-style: none;
        line-height: 2em;
      }
      /* Stil för dropdowns */
      .menu-select {
        width: 100%;
        padding: 10px;
        margin: 8px 0 20px 0;
        font-size: 16px;
        border-radius: 4px;
        border: 1px solid #ccc;
        background-color: #fff;
        color: #000;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #333;
          color: #fff;
        }
        a {
          color: #58a6ff;
        }
        .menu-select {
          background-color: #444;
          color: #fff;
          border: 1px solid #555;
        }
      }
    </style>
    <!-- Den ursprungliga skriptlänken som fungerar bäst -->
    <script type="module" src="https://unpkg.com/esp-web-tools@10.1.1/dist/web/install-button.js?module"></script>
  </head>
  <body>
    <div class="content">
      <h1>WICS-ESP32 installer</h1>
      <p>Only the Gateways and the PCA9685 Board is available for installation today.</p>
      
      <!-- Steg 1: Huvudval av kort -->
      <label for="main-category"><strong>Select Board:</strong></label>
      <select id="main-category" class="menu-select">
        <option value="">-- Choose Board --</option>
        <option value="gateway_multi">Gateway Board</option> <!-- Öppnar undermenyn -->
        <option value="./manifest_pca.json">PCA9685 Board</option>
        <option value="./manifest_mp3.json">MP3 Board</option>
        <option value="./manifest_multi2.json">Multi II Board</option>
      </select>

      <!-- Steg 2: Undermeny (Visas bara om man valde Gateway Board) -->
      <div id="sub-category-container" class="hidden">
        <label for="sub-category"><strong>Select Gateway MCU Variant:</strong></label>
        <select id="sub-category" class="menu-select">
          <option value="">-- Choose Chip & Feature --</option>
          <option value="./manifest_gateway_dcc_in_c6.json">DCC-IN (ESP32-C6)</option>
          <option value="./manifest_gateway_dcc_in_s3.json">DCC-IN (ESP32-S3)</option>
          <option value="./manifest_gateway_dcc_ex_c6.json">DCC-IN + DCC-EX (ESP32-C6)</option>
          <option value="./manifest_gateway_dcc_ex_s3.json">DCC-IN + DCC-EX (ESP32-S3)</option>
        </select>
      </div>

      <p class="button-row" align="center">
        <esp-web-install-button class="invisible"></esp-web-install-button>
      </p>

      <div class="footer">
        <a href="https://github.io">WICS - Wireless Control System</a> &mdash;
        Installer powered by <a href="https://github.io">ESP Web Tools</a>.
      </div>
    </div>

    <script>
      const mainSelect = document.getElementById('main-category');
      const subSelect = document.getElementById('sub-category');
      const subContainer = document.getElementById('sub-category-container');
      const button = document.querySelector('esp-web-install-button');

      // Hantera val i huvudmenyn
      mainSelect.addEventListener('change', () => {
        const val = mainSelect.value;
        
        // Återställ undermenyn och dölj installer-knappen vid byte
        subSelect.value = "";
        button.classList.add('invisible');
        button.removeAttribute('manifest');

        if (val === "gateway_multi") {
          // Om Gateway väljs: Visa undermenyn
          subContainer.classList.remove('hidden');
        } else if (val) {
          // Om ett fristående kort väljs: Dölj undermenyn och aktivera knappen direkt
          subContainer.classList.add('hidden');
          button.manifest = val;
          button.classList.remove('invisible');
        } else {
          // Om inget är valt
          subContainer.classList.add('hidden');
        }
      });

      // Hantera val i undermenyn (Gateway-varianterna)
      subSelect.addEventListener('change', () => {
        const manifestPath = subSelect.value;

        if (manifestPath) {
          button.manifest = manifestPath;
          button.classList.remove('invisible');
        } else {
          button.classList.add('invisible');
          button.removeAttribute('manifest');
        }
      });
    </script>
  </body>
</html>
